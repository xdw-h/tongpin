<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f6f8fc"><title>连接同频</title><link rel="icon" type="image/png" sizes="32x32" href="./icons/tongpin-v1-32.png"><link rel="apple-touch-icon" sizes="180x180" href="./icons/tongpin-v1-180.png"><link rel="manifest" href="./manifest.webmanifest"><script src="./theme.js"></script><link rel="stylesheet" href="./pair.css"><script src="./pair.js" defer></script><link rel="stylesheet" href="./theme.css"></head><body><main><div class="brand"><img src="./icons/tongpin-v1-192.png" width="52" height="52" alt="同频"></div><p class="eyebrow">同频 · AI 工作空间</p><h1>连接你的电脑</h1><p class="description">在电脑端打开同频「我的」，<br>输入「手机连接」中的访问码。</p><form id="pair-form"><label for="code">电脑访问码</label><input id="code" name="code" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="16" placeholder="XXXX-XXXX-XXXX" required><p class="hint">配对后，此设备可访问电脑上的任务和对话。</p><button type="submit">配对并进入同频 →</button><p id="message" role="status" aria-live="polite"></p></form><footer>电脑需保持开机，Codex 桌面程序需运行。<br>仅在可信的同一局域网内使用。</footer></main></body></html>
